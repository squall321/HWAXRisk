[project]
name = "hwax-risk"
version = "0.1.0"
description = "설계 IR 스냅샷·diff 위에서 HW/XD 전문가 패널이 리스크·개선·성격을 판정하고 등록부로 누적하는 HEAX 앱 (FastAPI + MCP streamable HTTP)"
requires-python = ">=3.12"
dependencies = [
    # mcp<2 핀: 2.0.0 은 FastMCP(mcp.server.fastmcp) 를 제거해 이 코드와 비호환.
    # hermetic SIF(PYTHONNOUSERSITE=1)에서 상한 없으면 mcp 2.0 이 깔려 크래시. (thermal_shock·materialtwin·laminate 동일)
    "mcp>=1.10,<2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    # identity.py 의 heax /auth/me 되묻기·PUT /me/portal-pat 의 포털 검증 호출(plan §8.2.3·§8.2.8).
    "httpx>=0.27",
    # identity.py 가 최상단에서 import 하는 Fernet — _user_credentials.portal_pat_enc 암복호(plan §8.2.7).
    "cryptography>=42",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
    "anyio>=4",
    "jsonschema>=4.21",
    "ruff>=0.5",
]

[project.scripts]
hwax-risk = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["schemas/*.json", "assets/*.json", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# 앱 코드는 한 줄이 길다(정규 표기·SQL 문자열). 규칙은 기본 E·F 에 한정한다 — 포맷터는 쓰지 않는다.
line-length = 140
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F"]
# 줄 길이는 기존 코드(정규 표기·SQL 문자열)가 이미 넘겨 두었다 — 규칙에서 뺀다.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 시험은 픽스처를 위해 import 순서를 섞고(E402) TYPE_CHECKING 밖 타입 이름을 문자열 없이 쓴다(F821).
"tests/*" = ["E402", "F821"]
