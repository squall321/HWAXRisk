# HEAXHub 앱 매니페스트(v2) — hwax_risk 앱 정본(plan §8.2.2). 등록 사본은 HEAXHub integrations/hwax-risk/.portal/manifest.yaml(동일 내용).
schema_version: 2
id: hwax_risk
name: HWAX Risk Review
version: 0.1.0
owner: cae-automation
status: beta
app_type: web_app
execution_target: linux_runner

description: |
  설계 IR 스냅샷·diff 위에서 HW/XD 전문가 패널이 리스크·개선·성격을 판정하고 등록부로 누적하는 심사 앱.
  과제의 MCAD(StepForge)·Dyna(DynaForge)·ECAD(ODB 어댑터 계약, 스텁) 소스를 읽기 전용으로 동결해 rr_ir 스냅샷을 만들고,
  상태 평가(rr_state)·3층 diff(rr_diff)를 결론 없이 코드가 정리하며, 좌석 의견을 IR id 에 앵커된 원자로 앱 DB 에 누적한다.
  - MCP 도구 7종(전부 실구현): risk_get_snapshot · risk_get_diff · risk_get_registry · risk_claims_for_ref ·
    risk_submit_panel_result · risk_get_brief(brief_token 필요) · risk_add_finding. 읽기 4종은 호출자 범위 밖이면 not_visible 이다.
  - MCP 엔드포인트: /apps/hwax_risk/mcp (streamable HTTP, exact Route — 리다이렉트 없음) → 게이트웨이 백엔드 heax-hwax_risk 로 자동 흡수.
    에이전트 등록 예) claude mcp add --transport http hwax-risk <포털베이스>/apps/hwax_risk/mcp
  - REST base: /apps/hwax_risk/api — 64경로(me·meta·projects·sources·snapshots·sameas·diffs·targets·panels·registry·
    findings·curation·patterns·precedents·vocab·export/import), 전 핸들러가 heax 신원 되묻기를 거친다.
  - 헬스체크: /api/health → {ok, app_version, schema_version}. 웹 UI 는 / 의 Vite/React SPA(화면 6종 — 홈·과제·스냅샷·비교·타깃·설정).
  - 데이터 경로: HWAXRISK_DATA_DIR > HEAX_DATA_DIR > <리포>/data, DB 파일 <data>/risk_review.db(단일 진실 원천, PRAGMA user_version, rr_* 41표).
  fastapi_react 스택(backend/ + frontend/) 기본 entrypoint(uvicorn app.main:app --root-path $ROOT_PATH)를 그대로 사용하며,
  SIF 빌드 훅 backend/scripts/heaxhub-build.sh 가 PYTHONNOUSERSITE=1 로 런타임 의존성을 hermetic 하게 재설치한다.
  loopback 바인드 + Caddy 경계 전제로 MCP DNS-rebinding Host 검증은 비활성화되어 있다.

tags:
  - risk-review
  - design-ir
  - graph-diff
  - cross-domain
  - mcp
  - llm-tools
  - cae

build:
  type: python_venv
  stack: fastapi_react
  python_version: "3.12"

launch:
  mode: service
  env:
    # hermetic 런타임 — 컨테이너가 호스트 ~/.local(user-site)을 무시하고 SIF 패키지만 쓰게 한다(MaterialTwinWeb 과 동일).
    # HWAXRISK_DATA_DIR 은 여기 두지 않는다 — HEAX 런처가 SIF 에 HEAX_DATA_DIR=/data 를 주므로 폴백만으로 충분하고,
    # 호스트 프로세스 실행 시 호스트 /data 오지정을 피한다(plan §8.2.6 P0 확인 항목).
    PYTHONNOUSERSITE: "1"
  health_check:
    type: http
    path: /api/health
  restart_policy:
    policy: on_failure
    max_attempts: 3

permissions:
  visibility: company

resources:
  cpu: 1
  memory_gb: 2
  gpu: false

# 등록 방식: HEAXHub/integrations/hwax-risk 에 이 파일의 복사본을 두면 5분 스캔이 발견하고,
# 빌드 소스는 GitHub — HEAXHub 최신화(재스캔/재빌드) 시 main 브랜치 최신 커밋을 받아온다.
# GitHub 리포는 아직 미생성이라 HEAXHub 등록은 보류 상태다(context-notes D4).
source:
  type: git
  url: https://github.com/squall321/HWAXRisk.git
  ref: main

# HWAX MCP Gateway 자동탐지 opt-in
mcp:
  expose: true
  path: /mcp
  transport: streamable_http
  description: 리스크 심사 등록부·스냅샷·diff 조회와 패널 결과 회수(risk_get_brief·risk_submit_panel_result). 에이전트 등록 예) claude mcp add --transport http hwax-risk <포털베이스>/apps/hwax_risk/mcp
  allowed_groups: []
